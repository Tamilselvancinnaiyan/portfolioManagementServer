name: Backend CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vestora
          POSTGRES_PASSWORD: vestora_test
          POSTGRES_DB: vestora_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U vestora -d vestora_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://vestora:vestora_test@localhost:5432/vestora_test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: ci-access-secret-for-tests-only-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-for-tests-only-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:cov
      - run: npm run db:migrate
      - run: npm run test:integration
